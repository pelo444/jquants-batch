<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>市場 | 大福帳</title>
<link rel="stylesheet" href="/style.css?v=20261021a">
<!-- ?v= は更新のたびに上げる(静的ファイルはブラウザに1時間キャッシュされるため。journal.html と同じ) -->
<link rel="stylesheet" href="/market.css?v=20261124b">
<link rel="stylesheet" href="/marketMacro.css?v=20261122a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M2 12l3.5-4 3 2.5L14 4' fill='none' stroke='%236B705C' stroke-width='1.6' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>
<div class="viz-root">

  <header class="topbar">
    <h1>市場</h1>
    <span class="meta" id="dataMeta">読み込み中…</span>
    <span class="spacer"></span>
    <a class="btn" href="/market" aria-current="page">市場</a>
    <a class="btn" href="/events">材料</a>
    <a class="btn" href="/daily">日々の確認</a>
    <a class="btn" href="/performance">騰落率一覧</a>
    <a class="btn" href="/stockchart">個別チャート</a>
    <a class="btn" href="/reference">参考情報</a>
    <a class="btn" href="/demand">シグナル</a>
    <a class="btn" href="/purchase">銘柄購入</a>
    <a class="btn" href="/journal">売買記録</a>
  </header>

  <div class="flash error" id="flash" role="status" hidden></div>
  <div class="flash warn" id="notice" role="status" hidden></div>

  <nav class="tabs" id="marketTabs">
    <button class="tab" data-tab="now" aria-selected="true" type="button">
      直近<span class="tab-sub">前の週の月曜から今日まで</span>
    </button>
    <button class="tab" data-tab="macro" aria-selected="false" type="button">
      マクロ<span class="tab-sub">週次</span>
    </button>
  </nav>

  <section class="panel" id="marketPanel">
    <h2 class="panel-title" id="periodTitle">市場</h2>
    <div class="table-wrap market-wrap"><table id="marketTable"></table></div>
  </section>

  <!-- ==================== マクロ(週次。もとは需給3階層の第一階層) ==================== -->
  <section class="pane" id="paneMacro" hidden>
    <div class="result-bar">
      <span class="ctl">
        <label class="opt">投資部門別の区分
          <select id="macroSection" class="btn"></select>
        </label>
      </span>
      <span class="ctl">
        <label class="opt">期間
          <select id="macroWeeks" class="btn">
            <option value="26">半年</option>
            <option value="52" selected>1年</option>
            <option value="104">2年</option>
            <option value="156">3年</option>
            <option value="260">5年</option>
          </select>
        </label>
      </span>
      <span class="status" id="macroStatus"></span>
      <span class="spacer"></span>
      <button class="btn" id="macroCsvBtn" type="button">CSV</button>
    </div>
    <p class="note" id="macroNotice" hidden></p>

    <div id="macroCharts"></div>

    <h2>週次の一覧 <span class="h2-note">新しい週が上</span></h2>
    <div class="table-wrap">
      <table id="macroTable"><thead></thead><tbody></tbody></table>
    </div>
  </section>

</div>
<script src="/market.js?v=20261124b"></script>
<script src="/demandChart.js?v=20261015y"></script>
<script src="/marketMacro.js?v=20261122a"></script>
</body>
</html>
