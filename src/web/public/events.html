<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>材料</title>
<link rel="stylesheet" href="/style.css?v=20261021a">

<link rel="stylesheet" href="/events.css?v=20261019a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M2 12l3.5-4 3 2.5L14 4' fill='none' stroke='%236B705C' stroke-width='1.6' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>
<div class="viz-root">

  <header class="topbar">
    <h1>材料</h1>
    <span class="meta" id="dataMeta">読み込み中…</span>
    <span class="spacer"></span>
    <a class="btn" href="/market">市場</a>
    <a class="btn" href="/events" aria-current="page">材料</a>
    <a class="btn" href="/daily">日々の確認</a>
    <a class="btn" href="/">騰落率一覧</a>
    <a class="btn" href="/reference">参考情報</a>
    <a class="btn" href="/demand">需給3階層</a>
    <a class="btn" href="/purchase">銘柄購入</a>
    <a class="btn" href="/journal">売買記録</a>
  </header>

  <div class="flash error" id="flash" role="status" hidden></div>

  <section class="panel events-period">
    <form class="ctl" id="periodForm">
      <label class="meta" for="fromMonth">期間</label>
      <input type="month" id="fromMonth" required>
      <span class="unit">〜</span>
      <input type="month" id="toMonth" required>
      <button class="btn" type="submit">表示</button>
    </form>
  </section>

  <div id="months"></div>

</div>
<script src="/events.js?v=20261020b"></script>
</body>
</html>
